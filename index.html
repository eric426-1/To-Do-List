<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>待辦事項清單 Todo List</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom scrollbar for task list */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 sm:p-6">

    <div class="bg-white w-full max-w-lg rounded-2xl shadow-xl overflow-hidden border border-slate-100 flex flex-col max-h-[90vh]">
        
        <!-- App Header -->
        <div class="bg-gradient-to-r from-blue-600 to-indigo-600 p-6 text-white">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-2xl font-bold tracking-tight flex items-center gap-2">
                        <i class="fa-solid font-bold fa-check-double text-blue-200"></i>
                        待辦事項
                    </h1>
                    <p class="text-blue-100 text-sm mt-1">有效規劃你的每一天</p>
                </div>
                <div class="text-right">
                    <span id="dateDisplay" class="text-xs font-medium bg-white/20 px-3 py-1 rounded-full text-white backdrop-blur-md">
                        --/--/--
                    </span>
                </div>
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="p-6 flex-1 flex flex-col min-h-0">
            
            <!-- Add Todo Input Form -->
            <form id="todoForm" class="flex gap-2 mb-6">
                <div class="relative flex-1">
                    <input 
                        type="text" 
                        id="todoInput" 
                        placeholder="新增待辦事項..." 
                        class="w-full pl-4 pr-10 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition duration-200 text-slate-700 placeholder-slate-400"
                        autocomplete="off"
                    >
                </div>
                <button 
                    type="submit" 
                    class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-3 rounded-xl font-medium shadow-md hover:shadow-lg transition duration-200 flex items-center justify-center gap-2 active:scale-95"
                >
                    <i class="fa-solid fa-plus"></i>
                    <span class="hidden sm:inline">新增</span>
                </button>
            </form>

            <!-- Status Filter Tabs & Action -->
            <div class="flex items-center justify-between pb-4 border-b border-slate-100 mb-4 text-sm">
                <div class="flex gap-1 bg-slate-100 p-1 rounded-xl">
                    <button id="filterAll" onclick="setFilter('all')" class="filter-btn px-3 py-1.5 rounded-lg font-medium text-xs sm:text-sm text-slate-600 hover:text-slate-900 transition">
                        全部
                    </button>
                    <button id="filterActive" onclick="setFilter('active')" class="filter-btn px-3 py-1.5 rounded-lg font-medium text-xs sm:text-sm text-slate-600 hover:text-slate-900 transition">
                        進行中
                    </button>
                    <button id="filterCompleted" onclick="setFilter('completed')" class="filter-btn px-3 py-1.5 rounded-lg font-medium text-xs sm:text-sm text-slate-600 hover:text-slate-900 transition">
                        已完成
                    </button>
                </div>

                <button 
                    id="clearCompletedBtn" 
                    onclick="clearCompleted()" 
                    class="text-xs text-slate-400 hover:text-red-500 transition font-medium hidden"
                >
                    清除已完成
                </button>
            </div>

            <!-- Todo Items List Container -->
            <div class="flex-1 overflow-y-auto custom-scrollbar pr-1">
                <ul id="todoList" class="space-y-2.5">
                    <!-- Dynamic tasks will be inserted here -->
                </ul>

                <!-- Empty State Message -->
                <div id="emptyState" class="hidden flex-col items-center justify-center py-12 text-slate-400">
                    <i class="fa-regular fa-clipboard text-4xl mb-3 text-slate-300"></i>
                    <p id="emptyStateText" class="text-sm">尚無待辦事項</p>
                </div>
            </div>

            <!-- Footer Stats -->
            <div class="pt-4 mt-2 border-t border-slate-100 flex justify-between items-center text-xs text-slate-400 font-medium">
                <span id="taskCounter">0 個待辦事項</span>
                <span class="text-slate-300">資料已儲存至 LocalStorage</span>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        const STORAGE_KEY = 'todo_app_tasks';
        let todos = [];
        let currentFilter = 'all';

        // DOM elements
        const todoForm = document.getElementById('todoForm');
        const todoInput = document.getElementById('todoInput');
        const todoList = document.getElementById('todoList');
        const emptyState = document.getElementById('emptyState');
        const emptyStateText = document.getElementById('emptyStateText');
        const taskCounter = document.getElementById('taskCounter');
        const clearCompletedBtn = document.getElementById('clearCompletedBtn');
        const dateDisplay = document.getElementById('dateDisplay');

        // Initialize App
        window.addEventListener('DOMContentLoaded', () => {
            displayTodayDate();
            loadTodos();
            render();
        });

        // Display current formatted date
        function displayTodayDate() {
            const now = new Date();
            const options = { month: 'short', day: 'numeric', weekday: 'short' };
            dateDisplay.textContent = now.toLocaleDateString('zh-TW', options);
        }

        // Load tasks from LocalStorage
        function loadTodos() {
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                todos = stored ? JSON.parse(stored) : [];
            } catch (error) {
                console.error('無法讀取 LocalStorage 資料:', error);
                todos = [];
            }
        }

        // Save tasks to LocalStorage
        function saveTodos() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
            } catch (error) {
                console.error('無法儲存至 LocalStorage:', error);
            }
        }

        // Handle form submit (Add new todo)
        todoForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = todoInput.value.trim();
            if (!text) return;

            const newTodo = {
                id: Date.now().toString(),
                text: text,
                completed: false,
                createdAt: new Date().toISOString()
            };

            todos.unshift(newTodo);
            saveTodos();
            todoInput.value = '';
            render();
        });

        // Toggle todo completed state
        function toggleTodo(id) {
            todos = todos.map(todo => {
                if (todo.id === id) {
                    return { ...todo, completed: !todo.completed };
                }
                return todo;
            });
            saveTodos();
            render();
        }

        // Delete single todo
        function deleteTodo(id) {
            todos = todos.filter(todo => todo.id !== id);
            saveTodos();
            render();
        }

        // Clear all completed tasks
        function clearCompleted() {
            todos = todos.filter(todo => !todo.completed);
            saveTodos();
            render();
        }

        // Change current display filter
        function setFilter(filter) {
            currentFilter = filter;
            render();
        }

        // Update filter button styles
        function updateFilterUI() {
            const filterBtns = {
                'all': document.getElementById('filterAll'),
                'active': document.getElementById('filterActive'),
                'completed': document.getElementById('filterCompleted')
            };

            Object.keys(filterBtns).forEach(key => {
                const btn = filterBtns[key];
                if (key === currentFilter) {
                    btn.className = 'filter-btn px-3 py-1.5 rounded-lg font-medium text-xs sm:text-sm bg-white text-blue-600 shadow-sm';
                } else {
                    btn.className = 'filter-btn px-3 py-1.5 rounded-lg font-medium text-xs sm:text-sm text-slate-600 hover:text-slate-900 transition';
                }
            });
        }

        // Main Render Function
        function render() {
            updateFilterUI();

            // Filter todos based on active tab
            let filteredTodos = todos;
            if (currentFilter === 'active') {
                filteredTodos = todos.filter(t => !t.completed);
            } else if (currentFilter === 'completed') {
                filteredTodos = todos.filter(t => t.completed);
            }

            // Render Task Items
            todoList.innerHTML = '';
            
            if (filteredTodos.length === 0) {
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
                
                if (currentFilter === 'active') {
                    emptyStateText.textContent = '沒有進行中的事項';
                } else if (currentFilter === 'completed') {
                    emptyStateText.textContent = '尚無已完成事項';
                } else {
                    emptyStateText.textContent = '尚無待辦事項，開始新增一筆吧！';
                }
            } else {
                emptyState.classList.add('hidden');
                emptyState.classList.remove('flex');

                filteredTodos.forEach(todo => {
                    const li = document.createElement('li');
                    li.className = `group flex items-center justify-between p-3.5 bg-slate-50 hover:bg-slate-100/80 rounded-xl transition-all duration-200 border border-slate-100 ${
                        todo.completed ? 'bg-slate-50/60 opacity-75' : ''
                    }`;

                    li.innerHTML = `
                        <div class="flex items-center gap-3 flex-1 min-w-0 mr-2 cursor-pointer" onclick="toggleTodo('${todo.id}')">
                            <button 
                                type="button"
                                class="w-5 h-5 rounded-md border flex items-center justify-center transition-colors ${
                                    todo.completed 
                                        ? 'bg-blue-600 border-blue-600 text-white' 
                                        : 'border-slate-300 group-hover:border-blue-500 bg-white'
                                }"
                            >
                                <i class="fa-solid fa-check text-xs ${todo.completed ? 'block' : 'hidden'}"></i>
                            </button>
                            <span class="text-sm font-medium text-slate-700 truncate select-none ${
                                todo.completed ? 'line-through text-slate-400' : ''
                            }">
                                ${escapeHtml(todo.text)}
                            </span>
                        </div>
                        <button 
                            onclick="deleteTodo('${todo.id}')" 
                            class="text-slate-400 hover:text-red-500 p-1.5 rounded-lg hover:bg-red-50 opacity-0 group-hover:opacity-100 sm:opacity-0 focus:opacity-100 transition-all duration-200"
                            title="刪除"
                        >
                            <i class="fa-regular fa-trash-can text-sm"></i>
                        </button>
                    `;

                    todoList.appendChild(li);
                });
            }

            // Update stats & clear button
            const activeCount = todos.filter(t => !t.completed).length;
            const completedCount = todos.filter(t => t.completed).length;

            taskCounter.textContent = `${activeCount} 個未完成項目`;

            if (completedCount > 0) {
                clearCompletedBtn.classList.remove('hidden');
            } else {
                clearCompletedBtn.classList.add('hidden');
            }
        }

        // Helper to prevent XSS attacks in input
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
